<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Verificação • Wave Studios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070b14;
            --card: rgba(15, 23, 42, 0.85);
            --border: rgba(37, 99, 235, 0.25);
            --blue: #2563eb;
            --blue-light: #60a5fa;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --ok: #22c55e;
            --err: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(37, 99, 235, 0.35), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59, 130, 246, 0.15), transparent);
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 3px solid var(--blue);
            box-shadow: 0 0 32px rgba(37, 99, 235, 0.45);
            object-fit: cover;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .sub {
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }

        .steps {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(37, 99, 235, 0.12);
        }

        .step-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .step-icon.pending { background: rgba(37, 99, 235, 0.2); color: var(--blue-light); }
        .step-icon.ok { background: rgba(34, 197, 94, 0.2); color: var(--ok); }
        .step-icon.fail { background: rgba(239, 68, 68, 0.2); color: var(--err); }

        .step span { font-size: 0.9rem; color: var(--muted); }
        .step.ok span, .step.fail span { color: var(--text); }

        .progress {
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 1.25rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--blue), var(--blue-light));
            border-radius: 99px;
            transition: width 0.6s ease;
        }

        .progress-fill.err { background: var(--err); }
        .progress-fill.ok { background: var(--ok); }

        .alert {
            display: none;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 1rem;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fecaca;
        }

        .actions { text-align: center; min-height: 48px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--blue), #1d4ed8);
            color: white;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
        }

        .btn-primary:hover { transform: translateY(-1px); }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .loading {
            color: var(--muted);
            font-size: 0.9rem;
        }

        footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .user-select-none {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>

<body class="user-select-none" oncontextmenu="return false">
    <div class="bg" aria-hidden="true"></div>

    <main class="card" id="card">
        <div class="avatar-wrap">
            <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="" class="avatar" id="avatar" width="88" height="88">
        </div>

        <h1 id="title">Wave Studios</h1>
        <p class="sub" id="subtitle">Verificação segura para aceder ao servidor Discord.</p>

        <div class="progress"><div class="progress-fill" id="progress"></div></div>

        <div class="steps">
            <div class="step" id="step-oauth">
                <div class="step-icon pending" id="icon-oauth">1</div>
                <span>Ligação com Discord (OAuth)</span>
            </div>
            <div class="step" id="step-vpn">
                <div class="step-icon pending" id="icon-vpn">2</div>
                <span>Verificação VPN / Proxy</span>
            </div>
            <div class="step" id="step-alt">
                <div class="step-icon pending" id="icon-alt">3</div>
                <span>Anti-alt e idade da conta</span>
            </div>
            <div class="step" id="step-role">
                <div class="step-icon pending" id="icon-role">4</div>
                <span>Atribuição do cargo verificado</span>
            </div>
        </div>

        <div class="alert" id="alert"></div>
        <div class="actions" id="actions">
            <p class="loading">A processar…</p>
        </div>

        <footer>Wave Studios • Verificação protegida</footer>
    </main>

    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            const error = params.get('error');
            const success = params.get('success');
            const username = params.get('username');
            const avatar = params.get('avatar');

            const els = {
                title: document.getElementById('title'),
                subtitle: document.getElementById('subtitle'),
                avatar: document.getElementById('avatar'),
                progress: document.getElementById('progress'),
                alert: document.getElementById('alert'),
                actions: document.getElementById('actions'),
                iconOauth: document.getElementById('icon-oauth'),
                iconVpn: document.getElementById('icon-vpn'),
                iconAlt: document.getElementById('icon-alt'),
                iconRole: document.getElementById('icon-role'),
                stepOauth: document.getElementById('step-oauth'),
                stepVpn: document.getElementById('step-vpn'),
                stepAlt: document.getElementById('step-alt'),
                stepRole: document.getElementById('step-role')
            };

            if (avatar) els.avatar.src = avatar;
            if (username) els.title.textContent = 'Olá, ' + username;

            function setStep(icon, step, state, label) {
                const num = { 'icon-oauth': '1', 'icon-vpn': '2', 'icon-alt': '3', 'icon-role': '4' };
                icon.className = 'step-icon ' + state;
                icon.textContent = state === 'ok' ? '✓' : state === 'fail' ? '✗' : (num[icon.id] || '•');
                step.classList.add(state);
                if (label) step.querySelector('span').textContent = label;
            }

            function failAllSteps() {
                setStep(els.iconOauth, els.stepOauth, 'fail');
                setStep(els.iconVpn, els.stepVpn, 'fail');
                setStep(els.iconAlt, els.stepAlt, 'fail');
                setStep(els.iconRole, els.stepRole, 'fail');
            }

            setTimeout(function () { els.progress.style.width = '25%'; }, 80);

            if (error) {
                els.progress.classList.add('err');
                els.progress.style.width = '100%';
                els.title.textContent = username ? 'Não foi possível, ' + username : 'Verificação falhou';
                els.subtitle.textContent = 'Corrige o problema abaixo e tenta de novo.';
                els.alert.textContent = decodeURIComponent(error);
                els.alert.style.display = 'block';
                failAllSteps();
                els.actions.innerHTML = '<a href="/" class="btn btn-ghost">Tentar novamente</a>';
                return;
            }

            if (success) {
                setTimeout(function () { els.progress.style.width = '70%'; }, 200);
                setTimeout(function () {
                    els.progress.classList.add('ok');
                    els.progress.style.width = '100%';
                    setStep(els.iconOauth, els.stepOauth, 'ok', 'Discord ligado');
                    setStep(els.iconVpn, els.stepVpn, 'ok', 'Sem VPN/Proxy');
                    setStep(els.iconAlt, els.stepAlt, 'ok', 'Identidade confirmada');
                    setStep(els.iconRole, els.stepRole, 'ok', 'Cargo atribuído');
                    els.title.textContent = username ? 'Tudo pronto, ' + username + '!' : 'Verificado!';
                    els.subtitle.textContent = 'Já podes voltar ao Discord. Podes fechar esta janela.';
                    els.actions.innerHTML = '<span class="btn btn-primary">✓ Verificação concluída</span>';
                }, 600);
                return;
            }

            setTimeout(function () { els.progress.style.width = '40%'; }, 400);
        })();

        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'p')) e.preventDefault();
        });
    </script>
</body>

</html>
