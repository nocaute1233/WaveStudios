<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Studios Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0b0f;
            --bg-secondary: #13141a;
            --bg-card: #1a1b23;
            --text-primary: #ffffff;
            --text-secondary: #a0a3bd;
            --accent-primary: #5865F2;
            --accent-secondary: #7289da;
            --success: #43b581;
            --error: #f04747;
            --warning: #faa61a;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-color: rgba(88, 101, 242, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0b0f 0%, #13141a 50%, #0f1015 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Effects */
        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.4) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(114, 137, 218, 0.3) 0%, transparent 70%);
            bottom: -5%;
            right: -5%;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.2) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -30px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 480px;
            max-width: 92%;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            backdrop-filter: blur(20px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--accent-primary);
            box-shadow:
                0 0 30px var(--glow-color),
                0 0 60px rgba(88, 101, 242, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: pulse 3s infinite ease-in-out;
        }

        .logo:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow:
                0 0 40px var(--glow-color),
                0 0 80px rgba(88, 101, 242, 0.3);
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow:
                    0 0 30px var(--glow-color),
                    0 0 60px rgba(88, 101, 242, 0.2);
            }

            50% {
                box-shadow:
                    0 0 40px var(--glow-color),
                    0 0 80px rgba(88, 101, 242, 0.3);
            }
        }

        /* Typography */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #ffffff 0%, #a0a3bd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            font-weight: 500;
        }

        /* Status Box */
        .status-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .status-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 0;
            transition: all 0.3s ease;
        }

        .status-item:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-icon {
            width: 32px;
            height: 32px;
            min-width: 32px;
            margin-right: 1rem;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .status-icon.pending {
            background: linear-gradient(135deg, #faa61a 0%, #f57c00 100%);
            box-shadow: 0 4px 15px rgba(250, 166, 26, 0.3);
            animation: spin 2s linear infinite;
        }

        .status-icon.success {
            background: linear-gradient(135deg, #43b581 0%, #2d7d46 100%);
            box-shadow: 0 4px 15px rgba(67, 181, 129, 0.3);
            animation: successPop 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .status-icon.error {
            background: linear-gradient(135deg, #f04747 0%, #c92a2a 100%);
            box-shadow: 0 4px 15px rgba(240, 71, 71, 0.3);
            animation: shake 0.5s ease;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes successPop {
            0% {
                transform: scale(0);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .status-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Progress Bar */
        .progress-container {
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 20px var(--glow-color);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .progress-bar.error {
            background: linear-gradient(90deg, var(--error) 0%, #c92a2a 100%);
            box-shadow: 0 0 20px rgba(240, 71, 71, 0.4);
        }

        .progress-bar.success {
            background: linear-gradient(90deg, var(--success) 0%, #2d7d46 100%);
            box-shadow: 0 0 20px rgba(67, 181, 129, 0.4);
        }

        /* Action Area */
        .action-area {
            margin-bottom: 1.5rem;
        }

        .btn {
            width: 100%;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            display: inline-block;
            text-align: center;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(88, 101, 242, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-error {
            background: linear-gradient(135deg, var(--error) 0%, #c92a2a 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(240, 71, 71, 0.3);
        }

        .btn-error:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(240, 71, 71, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success) 0%, #2d7d46 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(67, 181, 129, 0.3);
            cursor: default;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        /* Error Message */
        .error-msg {
            background: rgba(240, 71, 71, 0.1);
            border: 1px solid rgba(240, 71, 71, 0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            color: var(--error);
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.6;
            font-weight: 500;
        }

        /* Loading State */
        .loading-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            .logo {
                width: 75px;
                height: 75px;
            }
        }

        /* Success Confetti Effect */
        @keyframes confetti {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="background-effects">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="container" id="main-container">
        <div class="logo-container">
            <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Wave Studios" class="logo" id="server-logo">
        </div>

        <h1 id="title">Wave Studios</h1>
        <p class="subtitle" id="description">Secure verification required to access the server.</p>

        <div class="status-box">
            <div class="status-item">
                <div class="status-icon success">✓</div>
                <span class="status-text">Connect to Discord</span>
            </div>
            <div class="status-item">
                <div class="status-icon pending" id="icon-vpn">⟳</div>
                <span class="status-text">Security Check (VPN/Proxy)</span>
            </div>
            <div class="status-item">
                <div class="status-icon pending" id="icon-alt">⟳</div>
                <span class="status-text">Identity Verification</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="error-msg" id="error-text"></div>

        <div class="action-area" id="action-area">
            <p class="loading-text">Processing verification...</p>
        </div>

        <div class="footer">
            Protected by Wave Studios Security System • 2026
        </div>
    </div>

    <script>
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const success = params.get('success');
        const username = params.get('username');
        const avatar = params.get('avatar');

        // Elements
        const progressBar = document.getElementById('progress-bar');
        const actionArea = document.getElementById('action-area');
        const errorText = document.getElementById('error-text');
        const title = document.getElementById('title');
        const description = document.getElementById('description');
        const serverLogo = document.getElementById('server-logo');
        const iconVpn = document.getElementById('icon-vpn');
        const iconAlt = document.getElementById('icon-alt');

        // Update avatar if provided
        if (avatar) {
            serverLogo.src = avatar;
        }

        // Update username if provided
        if (username) {
            title.innerText = `Welcome, ${username}`;
        }

        // Initial progress animation
        setTimeout(() => {
            progressBar.style.width = '30%';
        }, 100);

        // Handle different states
        if (error) {
            // Error state
            setTimeout(() => {
                progressBar.classList.add('error');
                progressBar.style.width = '100%';

                title.innerText = username ? `Sorry, ${username}` : "Verification Failed";
                description.innerText = "Please resolve the issue below and try again.";

                errorText.innerText = decodeURIComponent(error);
                errorText.style.display = 'block';

                iconVpn.className = "status-icon error";
                iconVpn.innerText = "✗";

                iconAlt.className = "status-icon error";
                iconAlt.innerText = "✗";

                actionArea.innerHTML = `
                    <a href="/" class="btn btn-error">
                        <span>Try Again</span>
                    </a>
                `;
            }, 500);
        } else if (success) {
            // Success state
            setTimeout(() => {
                progressBar.classList.add('success');
                progressBar.style.width = '100%';
            }, 300);

            setTimeout(() => {
                title.innerText = username ? `Welcome, ${username}!` : "Verification Complete!";
                description.innerText = "You now have access to Wave Studios. You can close this window.";

                iconVpn.className = "status-icon success";
                iconVpn.innerText = "✓";

                iconAlt.className = "status-icon success";
                iconAlt.innerText = "✓";

                actionArea.innerHTML = `
                    <button class="btn btn-success">
                        <span>✓ Verified Successfully</span>
                    </button>
                `;
            }, 1000);
        } else {
            // Processing state
            setTimeout(() => {
                progressBar.style.width = '60%';
            }, 500);
        }
    </script>
</body>

</html>
